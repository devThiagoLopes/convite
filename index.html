<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembrete Júlia</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
    /* Configuração do Fundo - Mobile (padrão) */
    body {
        background-color: #000000;
        background-image: url('img/fundo.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        opacity: 0;
        animation: fadeInPagina .6s ease forwards;
    }

    /* Configuração do Fundo - Desktop (telas acima de 768px) */
    @media (min-width: 768px) {
        body {
            background-image: url('img/fundo-desktop.jpg');
        }
    }

    .fade-out {
        animation: fadeOut 1s forwards;
    }

    .envelope-open {
        animation: envelopeOpen 0.8s ease forwards;
    }

    @keyframes fadeInPagina {
        to {
            opacity: 1;
        }
    }

    @keyframes fadeOut {
        to {
            opacity: 0;
        }
    }

    @keyframes envelopeOpen {

        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.15);
        }

        100% {
            transform: scale(0);
            opacity: 0;
        }
    }

    /* Poeira dourada - animação leve sobre a página inteira */
    #poeiraDourada {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .particula-dourada {
        position: absolute;
        bottom: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, #f3d98a 0%, #cda729 60%, transparent 100%);
        box-shadow: 0 0 3px 0.5px rgba(205, 167, 41, 0.35);
        opacity: 0;
        animation-name: subirPoeira;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    @keyframes subirPoeira {
        0% {
            transform: translate(0, 0);
            opacity: 0;
        }

        10% {
            opacity: 0.3;
        }

        50% {
            transform: translate(var(--deriva-x), -50vh);
            opacity: 0.4;
        }

        90% {
            opacity: 0.15;
        }

        100% {
            transform: translate(calc(var(--deriva-x) * 1.6), -100vh);
            opacity: 0;
        }
    }

    /* Explosão de poeira dourada ao tocar no convite */
    .particula-explosao {
        position: fixed;
        top: 0;
        left: 0;
        border-radius: 50%;
        background: radial-gradient(circle, #fcecb0 0%, #cda729 55%, transparent 100%);
        box-shadow: 0 0 6px 1px rgba(205, 167, 41, 0.7);
        pointer-events: none;
        z-index: 30;
        animation: explodirPoeira .8s ease-out forwards;
    }

    @keyframes explodirPoeira {
        0% {
            transform: translate(0, 0) scale(1);
            opacity: 1;
        }

        100% {
            transform: translate(var(--dx), var(--dy)) scale(0.3);
            opacity: 0;
        }
    }
    </style>
</head>

<body>

    <!-- CAPA -->
    <section id="capa"
        class="relative z-10 min-h-screen flex justify-center items-center px-4">

        <div class="max-w-[380px] mx-auto min-h-screen flex flex-col items-center text-center px-5 py-8 relative">

            <img
                src="img/logo-julia.png"
                alt="Baile de Máscaras"
                class="w-full max-w-[200px] h-auto mb-4">

            <img
                src="img/logo-baile-mascaras.png"
                alt="Baile de Máscaras"
                class="w-full max-w-[500px] h-auto mb-4">

            <button id="btnEntrar" class=" text-lg text-gray-400 tracking-[4px] hover:text-white transition" style="font-family: 'Playfair Display', serif;">
            <!-- Envelope -->
            <img
                id="envelope"
                src="img/convite_dourado.png"
                alt="convite"
                class="mb-6">

                TOQUE PARA ABRIR

            </button>

        </div>

    </section>

    <script src="js/capa.js"></script>
    <script src="js/poeira.js"></script>

</body>

</html>
